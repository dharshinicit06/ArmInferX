# =============================================================================
# ArmInferX — Docker Compose (backend service; ARM64-native CPU deployment)
# =============================================================================
#
# Runs the FastAPI backend with the llama.cpp Q4_K_M engine. The ~470 MB
# Qwen2.5-0.5B-Instruct GGUF is either downloaded into the image at build time
# (docker/backend/Dockerfile) or bind-mounted read-only from the host at the
# engine's default path; either way no engine code or configuration changes.
#
# Usage (from the repo root):
#   docker compose up --build          # image for the host architecture
#   docker compose up -d               # start after build
#   docker compose exec backend python /app/scripts/run_llamacpp_benchmark.py
#
# ARM64 image from an x86 host:
#   docker buildx build --platform linux/arm64 \
#     -f docker/backend/Dockerfile -t arminferx-backend .
#
# See docs/arm64-deployment.md for the full build/verify/benchmark guide.
# =============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        # llama.cpp-only image by default (no torch/transformers). Enable the
        # FP16 Transformers baseline only on hardware where it is feasible
        # (>= 16 GiB RAM): set to "1".
        INSTALL_BASELINE_DEPS: "0"
    image: arminferx-backend:latest
    ports:
      - "8000:8000"
    environment:
      # CPU-only inference; llamacpp-optimized remains the default engine
      # (engine defaults tuned for low memory: n_ctx=1024, n_threads=2,
      # n_gpu_layers=0).
      ARMINFERX_DEFAULT_ENGINE: llamacpp-optimized
      ARMINFERX_DEVICE: cpu
      # Browser origins allowed by the API. Local dev defaults are always
      # enabled; add the deployed frontend origin for cloud deployments, e.g.
      #   ARMINFERX_CORS_ORIGINS=http://<SERVER_IP>:8080,http://<SERVER_IP>:80
      ARMINFERX_CORS_ORIGINS: ${ARMINFERX_CORS_ORIGINS:-}
    volumes:
      # Same Q4_K_M GGUF file as STEP 9/11 (Qwen2.5-0.5B-Instruct), mounted
      # read-only at the engine's default path
      # (/app/models/gguf/qwen2.5-0.5b-instruct-q4_k_m.gguf).
      - ./models/gguf:/app/models/gguf:ro
      # Optional: persist benchmark/generate records on the host.
      # - ./results:/app/results
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Frontend (static build served by nginx). VITE_API_URL tells the built JS
  # where the backend lives and is baked in at image build time:
  #   export VITE_API_URL=http://<SERVER_IP>:8000 && docker compose build frontend
  # See docs/cloud-deploy.md.
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    image: arminferx-frontend:latest
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
