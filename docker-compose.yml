# =============================================================================
# ArmInferX — Docker Compose (backend service; ARM64-native CPU deployment)
# =============================================================================
#
# Runs the FastAPI backend with the llama.cpp Q4_K_M engine. The ~2 GB GGUF is
# bind-mounted read-only from the host at the engine's default path, so no
# engine code or configuration is changed.
#
# Usage (from the repo root):
#   docker compose up --build          # image for the host architecture
#   docker compose up -d               # start after build
#   docker compose exec backend python /app/scripts/run_llamacpp_benchmark.py
#
# ARM64 image from an x86 host:
#   docker buildx build --platform linux/arm64 \
#     -f docker/backend/Dockerfile -t arminferx-backend .
#
# See docs/arm64-deployment.md for the full build/verify/benchmark guide.
# =============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        # llama.cpp-only image by default (no torch/transformers). Enable the
        # FP16 Transformers baseline only on hardware where it is feasible
        # (>= 16 GiB RAM): set to "1".
        INSTALL_BASELINE_DEPS: "0"
    image: arminferx-backend:latest
    ports:
      - "8000:8000"
    environment:
      # CPU-only inference; llamacpp-optimized remains the default engine
      # (engine defaults untouched: n_ctx=2048, n_threads=8, n_gpu_layers=0).
      ARMINFERX_DEFAULT_ENGINE: llamacpp-optimized
      ARMINFERX_DEVICE: cpu
    volumes:
      # Same Q4_K_M GGUF file as STEP 9/11, mounted read-only at the engine's
      # default path (/app/models/gguf/qwen2.5-3b-instruct-q4_k_m.gguf).
      - ./models/gguf:/app/models/gguf:ro
      # Optional: persist benchmark/generate records on the host.
      # - ./results:/app/results
    restart: unless-stopped
